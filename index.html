<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이번 주 베스트 프렌드 🌟</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fffaf0;
            color: #5c4033;
        }
        .handwriting {
            font-family: 'Nanum Pen Script', cursive;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.3);
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .sparkle-star {
            animation: sparkle 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-pink-200">

    <!-- 상단 장식 바 -->
    <header class="bg-gradient-to-r from-amber-100 via-pink-100 to-orange-100 py-6 px-4 shadow-sm text-center relative overflow-hidden">
        <div class="absolute left-4 top-2 text-2xl sparkle-star">✨</div>
        <div class="absolute right-8 bottom-2 text-2xl sparkle-star" style="animation-delay: 1s;">🌟</div>
        <h1 class="text-3xl md:text-4xl text-amber-800 tracking-wide drop-shadow-sm">
            🌿 우리 반 따뜻한 칭찬 주인공 🌿
        </h1>
        <p class="text-amber-700/80 mt-1 text-sm md:text-base">친구들이 직접 뽑은 베스트 프렌드를 소개합니다!</p>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="container mx-auto px-4 py-8 flex-grow flex flex-col items-center max-w-5xl">
        
        <!-- 주차 표시 바 -->
        <div class="w-full flex justify-between items-center mb-6 px-2">
            <div class="flex items-center space-x-2 bg-amber-50 px-4 py-2 rounded-full border border-amber-200 text-amber-900 shadow-sm">
                <span class="inline-block w-3 h-3 bg-green-400 rounded-full animate-ping"></span>
                <span id="current-week-label" class="text-base">2026년 1학기 3주차</span>
            </div>
            <div class="text-xs text-gray-500 flex items-center gap-1">
                <span>🔄 구글 시트 동기화:</span>
                <span id="last-sync-time">연동 대기 중</span>
            </div>
        </div>

        <!-- 이번 주 베스트 프렌드들 (다중 지원 그리드) -->
        <div class="w-full mb-12">
            <h2 class="text-2xl font-bold text-amber-900 mb-6 flex items-center gap-2">
                <span>👑 이번 주 베스트 프렌드</span>
                <span id="winners-count-badge" class="text-xs bg-pink-100 text-pink-700 px-2.5 py-1 rounded-full">0명 선정</span>
            </h2>
            
            <!-- 다중 수상자가 들어갈 컨테이너 -->
            <div id="current-winners-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
                <!-- 자바스크립트로 동적 생성됩니다 -->
            </div>
        </div>

        <!-- 명예의 전당 (구글 시트 아카이브 연동) -->
        <div class="w-full mt-4">
            <h3 class="text-2xl font-bold text-amber-900 mb-4 flex items-center gap-2">
                <span>📚 명예의 전당 (지난 베스트 프렌드)</span>
            </h3>
            <div id="archive-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 아카이브 카드 아이템들이 동적으로 로드됩니다 -->
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="bg-amber-50/50 py-4 text-center text-xs text-amber-800/60 border-t border-amber-100">
        <p>우리 반의 따뜻한 마음을 모으는 공간 🌸 의리T의 도덕 교실</p>
    </footer>

    <!-- 스크립트 영역 -->
    <script>
        // 🛠️ [설정] 배포한 구글 앱스 스크립트(GAS) 웹 앱 URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzbYnLJy4H-tq4U5qyhdGKW1-r7JFruLFvezFKXKPbfmRURfiV6Ag9vJX1bWOHx5k8yJg/exec"; 

        // 데모 데이터 (GAS URL이 없을 때 보여줄 기본 데이터)
        const demoData = {
            week: "2026년 1학기 3주차",
            currentWinners: [
                { name: "김도덕 친구", emoji: "🐰", message: "항상 밝은 미소로 친구들을 도와주어 고마워!" },
                { name: "이배려 친구", emoji: "🦊", message: "모둠 활동에서 늘 양보하고 리더십을 발휘했어요." }
            ],
            archive: [
                { week: "2주차", name: "박정직 친구", emoji: "🦁", message: "학급 청소를 스스로 도맡아 해주었습니다." },
                { week: "1주차", name: "최성실 친구", emoji: "꾸러기", message: "지각 없이 바른 생활을 보여줬어요." }
            ]
        };

        // DOM 요소 참조
        const currentWeekLabelEl = document.getElementById('current-week-label');
        const winnersContainer = document.getElementById('current-winners-container');
        const winnersCountBadge = document.getElementById('winners-count-badge');
        const archiveListEl = document.getElementById('archive-list');
        const lastSyncTimeEl = document.getElementById('last-sync-time');

        // 초기 실행
        if (GAS_WEB_APP_URL && GAS_WEB_APP_URL.trim() !== "") {
            startPollingData(GAS_WEB_APP_URL);
        } else {
            renderUI(demoData);
            lastSyncTimeEl.innerText = "데모 모드 구동 중";
        }

        function startPollingData(url) {
            fetchData(url);
            setInterval(() => fetchData(url), 10000); // 10초마다 자동 갱신
        }

        async function fetchData(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data) {
                    renderUI(data);
                    const now = new Date();
                    lastSyncTimeEl.innerText = `${now.getHours()}시 ${now.getMinutes()}분 갱신됨`;
                }
            } catch (error) {
                console.log("시트 연동 대기 중 혹은 CORS 오류 (데모 데이터 사용 중)");
            }
        }

        function renderUI(data) {
            // 주차 설정
            currentWeekLabelEl.innerText = data.week || "이번 주";

            // 이번 주 베스트 프렌드 렌더링 (다중 인원 지원)
            const winners = data.currentWinners || [];
            winnersCountBadge.innerText = `${winners.length}명 선정`;
            
            winnersContainer.innerHTML = "";
            if (winners.length === 0) {
                winnersContainer.innerHTML = `<div class="col-span-2 text-center py-8 text-gray-400 bg-white rounded-2xl border border-dashed border-amber-200">등록된 이번 주 베스트 프렌드가 없습니다.</div>`;
            } else {
                winners.forEach((winner, index) => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-3xl p-6 card-shadow border-4 border-pink-100 flex flex-col sm:flex-row items-center gap-6 relative overflow-hidden transition-all duration-300 hover:scale-[1.01]";
                    card.style.animationDelay = `${index * 0.2}s`;
                    
                    card.innerHTML = `
                        <div class="relative flex-shrink-0">
                            <div class="w-32 h-32 bg-gradient-to-tr from-pink-100 to-orange-100 rounded-full flex items-center justify-center border-4 border-white shadow-inner floating">
                                <span class="text-5xl">${winner.emoji || '⭐'}</span>
                            </div>
                            <div class="absolute -bottom-1 right-2 bg-yellow-300 text-yellow-900 text-[11px] px-2.5 py-0.5 rounded-full font-bold shadow">
                                👑 주인공
                            </div>
                        </div>
                        <div class="flex-grow text-center sm:text-left">
                            <div class="inline-block bg-pink-50 text-pink-700 text-[11px] px-2.5 py-0.5 rounded-full mb-1 font-semibold">
                                BEST FRIEND
                            </div>
                            <h3 class="text-2xl font-bold text-gray-800 mb-2">${winner.name}</h3>
                            <div class="bg-amber-50/60 p-3 rounded-2xl border border-amber-100">
                                <p class="text-[11px] text-amber-800 font-semibold mb-0.5">💌 친구들이 남긴 한마디</p>
                                <p class="handwriting text-xl text-gray-700 leading-snug">"${winner.message}"</p>
                            </div>
                        </div>
                    `;
                    winnersContainer.appendChild(card);
                });
            }

            // 명예의 전당(아카이브) 렌더링
            const archives = data.archive || [];
            archiveListEl.innerHTML = "";
            if (archives.length === 0) {
                archiveListEl.innerHTML = `<p class="text-gray-400 text-sm">등록된 기록이 없습니다.</p>`;
            } else {
                archives.forEach(item => {
                    const archCard = document.createElement('div');
                    archCard.className = "bg-white/90 p-4 rounded-2xl border border-amber-100 shadow-sm flex items-center space-x-3 transition hover:shadow-md";
                    archCard.innerHTML = `
                        <span class="text-3xl flex-shrink-0">${item.emoji || '🌟'}</span>
                        <div class="overflow-hidden">
                            <p class="text-xs text-amber-700 font-bold">${item.week}</p>
                            <p class="text-base font-bold text-gray-800 truncate">${item.name}</p>
                            <p class="text-xs text-gray-500 truncate">"${item.message}"</p>
                        </div>
                    `;
                    archiveListEl.appendChild(archCard);
                });
            }
        }
    </script>
</body>
</html>
